<!-- New post / Edit post share the same template to satisfy DRY (Do not repeat)-->

{% extends "base.html" %}
{% block title %}{% if postId %}Edit post{% else %}New post{% endif %}{% endblock %}
{% block content %}
    <h1>{% if postId %}Edit post{% else %}New post{% endif %}</h1>
    <form method="POST" action="{{ url_for('edit_post', post_id=ePostId) if ePostId else url_for('new_post') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label for="title">Title</label>
        <input type="text" id="title" name="title" value="{{ title }}" required maxlength="150">
        <label for="body">Body</label>
        <textarea id="body" name="body" rows="10" required maxlength="5000">{{ body }}</textarea>
        <button type="submit">Save</button>
    </form>
{% endblock %}
